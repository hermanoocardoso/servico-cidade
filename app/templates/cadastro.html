{% extends "base.html" %}
{% block titulo %}Cadastro{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Criar cadastro</h3>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="post" action="/cadastro">
            <div class="mb-3">
                <label class="form-label">Nome completo</label>
                <input type="text" name="nome" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Telefone (WhatsApp)</label>
                <input type="tel" name="telefone" class="form-control" placeholder="(22) 99999-9999" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required minlength="4">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cidade <span class="text-muted small">(opcional)</span></label>
                    <input type="text" name="cidade" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Bairro <span class="text-muted small">(opcional)</span></label>
                    <input type="text" name="bairro" class="form-control" placeholder="Usado pra te mostrar profissionais mais perto primeiro">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label d-block">Quero me cadastrar como:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipo" value="cliente" id="tipoCliente" checked>
                    <label class="form-check-label" for="tipoCliente">Cliente (quero contratar serviços)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipo" value="profissional" id="tipoProfissional">
                    <label class="form-check-label" for="tipoProfissional">Profissional (quero oferecer serviços)</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>

        {% if google_habilitado %}
        <div class="text-center my-3 text-muted small">ou</div>
        <a href="/auth/google/login" class="btn btn-outline-dark w-100">Cadastrar com Google</a>
        {% endif %}

        <p class="text-center mt-3 text-muted">Já tem conta? <a href="/login">Entrar</a></p>
    </div>
</div>
{% endblock %}
