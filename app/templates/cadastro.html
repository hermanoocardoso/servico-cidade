{% extends "base.html" %}
{% block titulo %}Cadastro{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Criar cadastro</h3>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="post" action="/cadastro">
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div class="mb-3">
                <label class="form-label">Nome completo</label>
                <input type="text" name="nome" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Telefone (WhatsApp)</label>
                <input type="tel" name="telefone" class="form-control" placeholder="(22) 99999-9999" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required minlength="4">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cidade <span class="text-muted small">(opcional)</span></label>
                    <input type="text" name="cidade" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Bairro <span class="text-muted small">(opcional)</span></label>
                    <input type="text" name="bairro" class="form-control" placeholder="Usado pra te mostrar profissionais mais perto primeiro">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label d-block">Quero me cadastrar como:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipo" value="cliente" id="tipoCliente"
                        {% if (tipo_selecionado or "cliente") == "cliente" %}checked{% endif %}>
                    <label class="form-check-label" for="tipoCliente">Cliente (quero contratar serviços)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipo" value="profissional" id="tipoProfissional"
                        {% if tipo_selecionado == "profissional" %}checked{% endif %}>
                    <label class="form-check-label" for="tipoProfissional">Profissional (quero oferecer serviços)</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>

        {% if google_habilitado %}
        <div class="text-center my-3 text-muted small">ou</div>
        <a href="/auth/google/login{% if next %}?next={{ next | urlencode }}{% endif %}" class="btn btn-outline-dark w-100 d-inline-flex align-items-center justify-content-center gap-2">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
            </svg>
            Cadastrar com Google
        </a>
        {% endif %}

        <p class="text-center mt-3 text-muted">Já tem conta? <a href="/login{% if next %}?next={{ next | urlencode }}{% endif %}">Entrar</a></p>
    </div>
</div>
{% endblock %}
