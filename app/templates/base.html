<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}SocorreAqui{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css?v={{ css_version }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🏃 SocorreAqui</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                    aria-controls="navMenu" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse flex-grow-0 ms-auto" id="navMenu">
                <div class="d-flex flex-column flex-lg-row gap-2 py-2 py-lg-0 align-items-lg-center">
                    {% if usuario %}
                        {% if usuario.tipo == "profissional" %}
                            <a href="/profissional/perfil/editar" class="btn btn-outline-light btn-sm">Meu perfil</a>
                        {% endif %}
                        <a href="/indicar" class="btn btn-outline-light btn-sm">Indicar profissional</a>
                        <a href="/minha-localizacao" class="btn btn-outline-light btn-sm">👤 Meus dados</a>
                        <span class="navbar-text text-white small">Olá, {{ usuario.nome.split(" ")[0] }}</span>
                        <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
                    {% else %}
                        <a href="/login" class="btn btn-outline-light btn-sm">👤 Entrar</a>
                        <a href="/cadastro" class="btn btn-light btn-sm">Cadastrar</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block conteudo %}{% endblock %}
    </div>

    <footer class="site-footer text-center py-4">
        <img src="/static/h2-logo.png" alt="H2 Sistemas" class="site-footer-logo">
        <span>Desenvolvido por H2 Sistemas</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
