{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-4">Entrar</h3>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        {% if google_habilitado %}
        <div class="text-center my-3 text-muted small">ou</div>
        <a href="/auth/google/login" class="btn btn-outline-dark w-100">Entrar com Google</a>
        {% endif %}

        <p class="text-center mt-3 text-muted">Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
    </div>
</div>
{% endblock %}
